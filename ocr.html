<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azure OCR</title>
</head>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* FONDO NUEVO */
body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e1b4b, #020617);
    color: #e5e7eb;
    padding: 2rem;
}

/* CONTENEDOR */
.container {
    max-width: 700px;
    margin: 0 auto;
}

/* HEADER */
.header {
    margin-bottom: 2rem;
}

.header h2 {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(90deg, #22d3ee, #a78bfa);
    -webkit-background-clip: text;
    color: transparent;
}

.header p {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 6px;
}

/* CARD (glass style) */
.card {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 16px;
    padding: 1.8rem;
    margin-bottom: 1.2rem;
    backdrop-filter: blur(12px);
}

/* CAMPOS */
.field {
    margin-bottom: 1.3rem;
}

.field:last-child {
    margin-bottom: 0;
}

label {
    display: block;
    font-size: 13px;
    color: #cbd5f5;
    margin-bottom: 6px;
}

/* INPUT */
input[type="text"] {
    width: 100%;
    padding: 13px;
    font-size: 14px;
    background: rgba(2, 6, 23, 0.8);
    border: 1px solid #1e293b;
    border-radius: 10px;
    color: #e2e8f0;
    transition: 0.2s;
}

input:focus {
    border-color: #22d3ee;
    box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
}

/* BOTÓN */
button#analyzeBtn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(90deg, #22d3ee, #6366f1);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
}

button#analyzeBtn:hover {
    transform: scale(1.03);
    opacity: 0.9;
}

button#analyzeBtn:disabled {
    background: #334155;
    cursor: not-allowed;
}

/* STATUS */
.status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 1rem;
    background: rgba(2, 6, 23, 0.8);
    border: 1px solid #1e293b;
}

/* ESTADOS */
.status-bar.running {
    border-color: #22d3ee;
    color: #22d3ee;
}

.status-bar.success {
    border-color: #4ade80;
    color: #4ade80;
}

.status-bar.error {
    border-color: #f87171;
    color: #f87171;
}

/* SPINNER */
.spinner {
    width: 16px;
    height: 16px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* RESULTADO */
.result-box {
    background: rgba(2, 6, 23, 0.9);
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 1.2rem;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    font-family: monospace;
    color: #e2e8f0;
    min-height: 100px;
}

/* OCULTO */
.hidden {
    display: none;
}

/* BOTÓN COPIAR */
.copy-btn {
    background: transparent;
    border: 1px solid #334155;
    color: #cbd5f5;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.copy-btn:hover {
    background: #1e293b;
}
</style>

<body>
    <div class="container">
        <div class="header">
            <h2>Azure OCR</h2>
            <p>Detección de texto en imágenes con Azure Computer Vision</p>
        </div>

        <div class="card">
            <div class="field">
                <label for="imageUrl">URL de la imagen o PDF</label>
                <input type="text" id="imageUrl"
                    value="https://image.slidesharecdn.com/eleditorial-220301120619/95/El-editorial-3-638.jpg" />
            </div>
            <button id="analyzeBtn" onclick="analizarTexto()">Analizar imagen</button>
        </div>

        <div id="statusBar" class="status-bar hidden">
            <span id="statusIcon"></span>
            <span id="statusMsg"></span>
        </div>

        <div id="resultSection" class="hidden">
            <div class="card">
                <div id="pagesContainer"></div>
            </div>
        </div>
    </div>

    <script src="ocr.js"></script>
</body>

</html>
