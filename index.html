<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure AI - Servicios</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Segoe UI',sans-serif;
    display:flex;
    min-height:100vh;
    background:linear-gradient(135deg,#020617,#0f172a);
    color:#e2e8f0;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    background:rgba(15,23,42,0.9);
    backdrop-filter:blur(15px);
    border-right:1px solid #1e293b;
    display:flex;
    flex-direction:column;
    padding:20px 0;
}

.logo{
    padding:0 20px 20px;
    border-bottom:1px solid #1e293b;
}
.logo h1{
    font-size:18px;
    display:flex;
    gap:10px;
    align-items:center;
}
.logo p{
    font-size:12px;
    opacity:0.5;
}

/* MENU */
.menu{
    flex:1;
    padding-top:10px;
}
.label{
    font-size:11px;
    opacity:0.4;
    padding:10px 20px;
}
.item{
    display:flex;
    gap:10px;
    align-items:center;
    padding:10px 20px;
    cursor:pointer;
    text-decoration:none;
    color:#cbd5f5;
    transition:0.2s;
}
.item:hover,
.item.active{
    background:#1e293b;
    color:#fff;
}

/* MAIN */
.main{
    flex:1;
    padding:40px;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:20px;
    margin-top:30px;
}
.card{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:14px;
    padding:20px;
    cursor:pointer;
    transition:0.2s;
}
.card:hover{
    transform:translateY(-5px);
    border-color:#3b82f6;
}
.card i{
    font-size:20px;
    margin-bottom:10px;
}
.card h3{
    font-size:15px;
}
.card p{
    font-size:12px;
    opacity:0.5;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">
        <h1><i class="fa-solid fa-brain"></i> Azure AI</h1>
        <p>Panel inteligente</p>
    </div>

    <div class="menu">

        <div class="label">Visión</div>
        <a class="item" href="ocr.html"><i class="fa-solid fa-file-lines"></i> OCR</a>
        <a class="item" href="imagen.html"><i class="fa-solid fa-image"></i> Imágenes</a>
        <a class="item" href="deteccion.html"><i class="fa-solid fa-crosshairs"></i> Objetos</a>
        <a class="item" href="extraccion.html"><i class="fa-solid fa-file-export"></i> Extracción</a>

        <div class="label">Lenguaje</div>
        <a class="item" href="sentimientos.html"><i class="fa-solid fa-face-smile"></i> Sentimientos</a>
        <a class="item active" href="preguntas.html"><i class="fa-solid fa-circle-question"></i> Preguntas</a>

        <div class="label">IA</div>
        <a class="item" href="chat.html"><i class="fa-solid fa-comments"></i> Chat</a>
        <a class="item" href="chatgpt.html"><i class="fa-solid fa-robot"></i> GPT</a>

    </div>

</div>

<!-- MAIN -->
<div class="main">

    <h2>👋 Bienvenido, Christian</h2>
    <p>Selecciona un servicio para comenzar</p>

    <div class="cards">

        <div class="card" onclick="location.href='ocr.html'">
            <i class="fa-solid fa-file-lines"></i>
            <h3>OCR</h3>
            <p>Extrae texto de imágenes</p>
        </div>

        <div class="card" onclick="location.href='imagen.html'">
            <i class="fa-solid fa-image"></i>
            <h3>Imágenes</h3>
            <p>Análisis visual IA</p>
        </div>

        <div class="card" onclick="location.href='deteccion.html'">
            <i class="fa-solid fa-crosshairs"></i>
            <h3>Objetos</h3>
            <p>Detecta elementos</p>
        </div>

        <div class="card" onclick="location.href='extraccion.html'">
            <i class="fa-solid fa-file-export"></i>
            <h3>Extracción</h3>
            <p>Procesa texto</p>
        </div>

    </div>

</div>

</body>
</html>
