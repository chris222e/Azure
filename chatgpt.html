<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat GPT</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f172a,#020617);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* CONTENEDOR */
.chat{
    width:650px;
    height:85vh;
    background:#0b1220;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid #1e293b;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:#020617;
    border-bottom:1px solid #1e293b;
}

.title{
    font-size:14px;
    font-weight:600;
}

.tokens{
    font-size:12px;
    opacity:0.6;
}

/* MENSAJES */
.messages{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.msg{
    padding:12px 15px;
    border-radius:14px;
    max-width:75%;
    font-size:14px;
    line-height:1.5;
}

/* USER */
.user{
    align-self:flex-end;
    background:#3b82f6;
}

/* BOT */
.bot{
    align-self:flex-start;
    background:#1e293b;
}

/* INPUT */
.input{
    display:flex;
    gap:10px;
    padding:15px;
    background:#020617;
    border-top:1px solid #1e293b;
}

input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:#1e293b;
    color:white;
}

button{
    padding:12px 16px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.8;
}
</style>
</head>

<body>

<div class="chat">
    
    <div class="header">
        <div class="title">🤖 GPT-5.4 mini</div>
        <div class="tokens" id="tokensBadge">Tokens: 0</div>
    </div>

    <div class="messages" id="chatMessages">
        <div class="msg bot">Hola 👋 ¿En qué puedo ayudarte?</div>
    </div>

    <div class="input">
        <input id="userInput" placeholder="Escribe aquí..." onkeydown="handleKey(event)">
        <button onclick="enviar()">Enviar</button>
    </div>

</div>

<script src="chatgpt.js"></script>

</body>
</html>
