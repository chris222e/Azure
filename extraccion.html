<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXTRACCIÓN</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Segoe UI',sans-serif;
    background:#020617;
    color:#e5e7eb;
    display:flex;
    justify-content:center;
    padding:30px;
}

/* CONTENEDOR */
.container{
    width:1000px;
}

/* HEADER */
h1{
    text-align:center;
    margin-bottom:30px;
    font-size:26px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

/* CARDS */
.card{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:12px;
    padding:18px;
}

/* TEXTAREA */
textarea{
    width:100%;
    height:200px;
    background:#020617;
    border:1px solid #1e293b;
    border-radius:10px;
    padding:12px;
    color:white;
    resize:none;
}

/* BOTON */
button{
    width:100%;
    padding:12px;
    background:#22c55e;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
    font-weight:600;
}
button:hover{opacity:0.8}

/* TABLA */
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:10px;
    border-bottom:1px solid #1e293b;
    text-align:left;
    font-size:14px;
}
th{
    font-size:11px;
    text-transform:uppercase;
    opacity:0.6;
}

/* CATEGORIAS */
.cats{
    display:flex;
    flex-direction:column;
    gap:10px;
}
label{
    font-size:14px;
    display:flex;
    gap:8px;
    cursor:pointer;
}
input[type="checkbox"]{
    accent-color:#22c55e;
}
</style>
</head>

<body>

<div class="container">

    <h1>🧠 Extracción Inteligente</h1>

    <div class="grid">

        <!-- IZQUIERDA -->
        <div class="card">
            <textarea id="textoEntrada" placeholder="Escribe o pega tu texto aquí..."></textarea>

            <br><br>

            <table>
                <thead>
                    <tr>
                        <th>Texto</th>
                        <th>Categoría</th>
                        <th>%</th>
                    </tr>
                </thead>
                <tbody id="tbodyResultados"></tbody>
            </table>
        </div>

        <!-- DERECHA -->
        <div class="card">

            <button id="btnAnalizar">Analizar</button>

            <br><br>

            <div class="cats">
                <label><input type="checkbox" value="DateTime" checked> DateTime</label>
                <label><input type="checkbox" value="Organization"> Organization</label>
                <label><input type="checkbox" value="PersonType"> PersonType</label>
                <label><input type="checkbox" value="Location" checked> Location</label>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="extraccion.js"></script>

</body>
</html>
