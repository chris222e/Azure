<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detección IA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: monospace;
    background:#020617;
    color:#00ffcc;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* CONTENEDOR */
.app{
    width:750px;
    border:1px solid #00ffcc33;
    border-radius:12px;
    padding:20px;
    box-shadow:0 0 25px #00ffcc22;
}

/* HEADER */
.header{
    margin-bottom:20px;
}
.header h2{
    color:#00ffcc;
}
.header p{
    color:#00ffcc88;
    font-size:12px;
}

/* INPUT */
.input-box{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}
input{
    flex:1;
    padding:10px;
    border:1px solid #00ffcc33;
    background:#000;
    color:#00ffcc;
}
button{
    padding:10px;
    border:none;
    background:#00ffcc;
    color:#000;
    cursor:pointer;
}
button:hover{
    background:#00ffaa;
}

/* STATUS */
.status{
    padding:8px;
    font-size:12px;
    margin-bottom:15px;
    display:none;
}
.status.active{display:block}
.status.ok{color:#00ff88}
.status.error{color:#ff4d4d}
.status.load{color:#00ccff}

/* IMAGEN */
.preview{
    position:relative;
    margin-bottom:15px;
}
.preview img{
    width:100%;
    border:1px solid #00ffcc33;
}
.preview canvas{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
}

/* RESULTADOS */
.list{
    max-height:200px;
    overflow:auto;
    border-top:1px solid #00ffcc33;
}
.item{
    padding:8px;
    border-bottom:1px solid #00ffcc22;
}
.item span{
    float:right;
    color:#00ff88;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h2>>_ Detección IA</h2>
        <p>Sistema activo...</p>
    </div>

    <div class="input-box">
        <input id="imageUrl" placeholder="Pega URL de imagen...">
        <button onclick="detectarObjetos()">RUN</button>
    </div>

    <div id="statusBar" class="status"></div>

    <div id="resultSection" style="display:none">

        <div class="preview">
            <img id="previewImg" crossorigin="anonymous">
            <canvas id="overlay"></canvas>
        </div>

        <div id="objectList" class="list"></div>

    </div>

</div>

<script src="deteccion.js"></script>

</body>
</html>
