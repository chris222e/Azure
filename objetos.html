<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Objetos</title>
</head>
<style>
    /* ================================================
   styles.css — Azure Vision (Light Mode)
   index.html · ocr.html · objetos.html
   ================================================ */

   @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

:root {
--bg: #0f172a;
--card: rgba(255, 255, 255, 0.05);
--border: rgba(255, 255, 255, 0.1);
--primary: #22c55e;
--primary-glow: rgba(34, 197, 94, 0.3);
--text: #e2e8f0;
--text-soft: #94a3b8;
}

/* RESET */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  }

body {
font-family: 'Poppins', sans-serif;
background: radial-gradient(circle at top, #1e293b, #020617);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
color: var(--text);
}

/* CONTENEDOR */
.container {
width: 100%;
max-width: 500px;
padding: 30px;
border-radius: 20px;


}

/* TITULO */
h1 {
text-align: center;
margin-bottom: 20px;
font-weight: 600;
letter-spacing: 1px;
}

/* INPUT */
input {
width: 100%;
padding: 12px;
border-radius: 10px;
border: 1px solid var(--border);
background: transparent;
color: var(--text);
outline: none;
margin-bottom: 15px;
}

input::placeholder {
color: var(--text-soft);
}

/* BOTON */
button {
width: 100%;
padding: 12px;
border: none;
border-radius: 10px;
background: var(--primary);
color: white;
font-weight: 500;
cursor: pointer;
transition: 0.2s;
}

button:hover {
box-shadow: 0 0 15px var(--primary-glow);
transform: translateY(-2px);
}

/* BOTON VOLVER */
a button {
margin-top: 10px;
background: transparent;
border: 1px solid var(--border);
}

/* RESULTADO */
.result {
margin-top: 20px;
padding: 15px;
border-radius: 12px;
background: rgba(255,255,255,0.05);
border: 1px solid var(--border);
min-height: 100px;
}

/* FILAS */
.result-row {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 10px;
}

/* TEXTO OBJETO */
.obj-name {
flex: 1;
}

/* BARRA */
.confidence-track {
width: 80px;
height: 5px;
background: #1e293b;
border-radius: 50px;
}

.confidence-fill {
height: 100%;
background: var(--primary);
border-radius: 50px;
}

/* PORCENTAJE */
.confidence-pct {
font-size: 12px;
}

/* LOADER */
.loader {
text-align: center;
}

.spinner {
border: 3px solid #1e293b;
border-top: 3px solid var(--primary);
border-radius: 50%;
width: 20px;
height: 20px;
animation: spin 1s linear infinite;
margin: auto;
}

@keyframes spin {
100% { transform: rotate(360deg); }
}

</style>

<body>

    <div class="container">
        <h1>Detección de Objetos</h1>

        <label>Pega la URL de la imagen:</label>
        <input type="text" id="objImageUrl" placeholder="https://ejemplo.com/foto.jpg">

        <button onclick="detectarObjetos()" class="btn-secondary">
            Detectar Objetos
        </button>

        <div class="result" id="objResult">
            Aquí aparecerán los objetos detectados...
        </div>

        <br>

        <a href="index.html">
            <button>Volver al inicio</button>
        </a>
    </div>

    <script src="js/objetos.js"></script>
</body>

</html>
