<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detección de Objetos - Azure AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/vision.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <h1>
        <i class="ph ph-graduation-cap"></i>
        Azure AI
      </h1>
      <p>Dashboard inteligente</p>
    </div>

    <nav class="nav-section">
      <div class="nav-label">👁️ Visión</div>
      <a href="ocr.html" class="nav-item">
        <i class="ph ph-book-open-text"></i>
        OCR
      </a>
      <a href="vision-analysis.html" class="nav-item">
        <i class="ph ph-image-square"></i>
        Análisis de Imágenes
      </a>
      <a href="object-detection.html" class="nav-item active">
        <i class="ph ph-magnifying-glass"></i>
        Detección de Objetos
      </a>
    </nav>

    <nav class="nav-section">
      <div class="nav-label">📝 Lenguaje</div>
      <a href="entity-extraction.html" class="nav-item">
        <i class="ph ph-tag"></i>
        Extracción de Entidades
      </a>
    </nav>

    <nav class="nav-section">
      <div class="nav-label">🤖 IA</div>
      <a href="chat.html" class="nav-item">
        <i class="ph ph-chat-dots"></i>
        Chat (Phi-4)
      </a>
      <a href="chat-gpt.html" class="nav-item">
        <i class="ph ph-robot"></i>
        GPT Chat
      </a>
    </nav>
  </aside>

  <main class="main">
    <header class="header">
      <h2>🔍 Detección de Objetos</h2>
      <p>Identifica y localiza objetos dentro de imágenes automáticamente</p>
    </header>

    <div id="statusBar" class="status-bar hidden">
      <span id="statusIcon" class="status-icon"></span>
      <span id="statusMsg" class="status-msg"></span>
    </div>

    <div class="vision-container">
      <!-- INPUT SECTION -->
      <div class="input-section">
        <h3>Cargar Imagen</h3>
        <div class="form-group">
          <label for="imageUrl">URL de la imagen</label>
          <input
            type="url"
            id="imageUrl"
            placeholder="https://ejemplo.com/imagen.jpg"
          >
        </div>
        <button class="btn btn-primary" id="analyzeBtn" onclick="detectObjects()">
          <i class="ph ph-magnifying-glass"></i>
          Detectar
        </button>
      </div>

      <!-- RESULT SECTION -->
      <div id="resultSection" class="result-section hidden">
        <h3>Objetos Detectados</h3>
        <img id="previewImg" class="preview-img" alt="Vista previa">
        <canvas id="overlay"></canvas>
        <div class="meta-row">
          <span class="meta-label">Lista de Objetos</span>
        </div>
        <div id="objectList" class="object-list"></div>
      </div>
    </div>
  </main>
</div>

<script src="../js/ui-helpers.js"></script>
<script src="../js/services/object-detection.js"></script>

</body>
</html>
