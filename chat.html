<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Phi-4</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.chat{
    width:400px;
    height:85vh;
    background:#111827;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* HEADER */
.header{
    padding:15px;
    background:#1f2937;
    font-weight:bold;
    text-align:center;
}

/* MENSAJES */
.messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    padding:10px 14px;
    border-radius:12px;
    max-width:75%;
    font-size:14px;
}

.user{
    background:#2563eb;
    align-self:flex-end;
}

.bot{
    background:#374151;
    align-self:flex-start;
}

/* INPUT */
.input-area{
    display:flex;
    padding:10px;
    background:#1f2937;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="chat">
    <div class="header">🤖 Chat Phi-4</div>

    <div class="messages" id="chatMessages">
        <div class="msg bot">Hola 👋 ¿En qué te ayudo?</div>
    </div>

    <div class="input-area">
        <input id="userInput" placeholder="Escribe..." onkeydown="handleKey(event)">
        <button onclick="enviar()">➤</button>
    </div>
</div>

<script src="chat.js"></script>

</body>
</html>
